<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen OS · LUX-32</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1100px 560px at 18% -12%, #ffffff 0%, #e9edf4 55%, #dde4ee 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #1b2230;
    display: flex; align-items: center; justify-content: center;
    padding: 22px;
  }
  .rig {
    width: min(1200px, 100%);
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    grid-template-rows: auto 1fr;
    gap: 14px 16px;
  }
  /* ---------- 顶栏 ---------- */
  .bar {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, #202838, #171d29);
    border-radius: 14px;
    padding: 12px 18px;
    box-shadow: 0 10px 26px rgba(20,30,50,.18), inset 0 1px 0 rgba(255,255,255,.08);
    color: #e8eef8;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(145deg, #6df29a, #26b8c4);
    display: grid; place-items: center;
    color: #0a0c0e; font-weight: 800; font-size: 17px;
    box-shadow: 0 0 16px rgba(109,242,154,.35);
  }
  .brand h1 { margin: 0; font-size: 16px; letter-spacing: .14em; font-weight: 700; }
  .brand h1 span { color: #6df29a; margin-left: 3px; }
  .brand p { margin: 2px 0 0; font-size: 11px; color: #8fa0b8; letter-spacing: .06em; }
  .actions { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .led { width: 8px; height: 8px; border-radius: 50%; background: #6df29a; box-shadow: 0 0 10px #6df29a; }
  .led.idle { background: #ffe066; box-shadow: 0 0 10px #ffe066; }
  .led.off { background: #5c6673; box-shadow: none; }
  #pwr { color: #8fa0b8; letter-spacing: .16em; font-size: 10px; min-width: 62px; }
  #uptime { color: #6df29a; font-variant-numeric: tabular-nums; font-size: 11px; }
  .actions button {
    appearance: none; border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.06); color: #dbe6f5;
    padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
    transition: .15s;
  }
  .actions button:hover { background: rgba(109,242,154,.16); border-color: rgba(109,242,154,.4); color: #fff; }

  /* ---------- 屏幕 ---------- */
  .crt { min-width: 0; }
  .bezel {
    position: relative;
    background: linear-gradient(170deg, #2a3242, #131923 60%, #0d1119);
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 24px 50px rgba(18,26,40,.28), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .screen {
    position: relative;
    background: #0a0c0e;
    border-radius: 8px;
    padding: 14px 16px;
    font-family: "Cascadia Mono", "Consolas", "SFMono-Regular", "Menlo", monospace;
    font-size: 15px;
    line-height: 1.16;
    letter-spacing: 0;
    overflow: hidden;
    box-shadow: inset 0 0 40px rgba(0,0,0,.9), inset 0 0 3px rgba(109,242,154,.25);
  }
  .row { white-space: pre; height: 17.4px; }
  .cur { background: #6df29a; color: #0a0c0e; }
  .w2 { display: inline-block; width: 2ch; text-align: center; text-indent: 0; }
  .glass {
    position: absolute; inset: 16px;
    border-radius: 8px; pointer-events: none;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px),
      radial-gradient(120% 90% at 50% 0%, rgba(109,242,154,.06), transparent 60%);
    mix-blend-mode: screen;
  }
  .hint {
    margin-top: 10px; text-align: center;
    font-size: 11px; color: #7b879b; letter-spacing: .04em;
  }

  /* ---------- 侧面板 ---------- */
  .panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 12px 14px 13px;
    box-shadow: 0 6px 18px rgba(25,35,55,.07), inset 0 0 0 1px rgba(20,30,50,.05);
  }
  .card h2 {
    margin: 0 0 8px; font-size: 10px; letter-spacing: .18em;
    color: #8b97a9; text-transform: uppercase; font-weight: 700;
  }
  .kvrow, .taskrow, .filerow {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11.5px; padding: 2.5px 0; gap: 8px;
  }
  .kvrow span { color: #8b97a9; }
  .kvrow b { font-family: "Cascadia Mono", Consolas, monospace; font-weight: 600; color: #1b2230; font-variant-numeric: tabular-nums; }
  .taskrow b { font-family: Consolas, monospace; color: #2b4bd8; width: 22px; }
  .taskrow span { flex: 1; color: #2a3444; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .taskrow i { font-style: normal; font-size: 10px; color: #97a3b5; }
  .taskrow.on { background: rgba(109,242,154,.16); border-radius: 6px; padding-left: 4px; padding-right: 4px; }
  .filerow span { font-family: Consolas, monospace; color: #2a3444; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filerow i { font-style: normal; font-size: 10px; color: #97a3b5; font-variant-numeric: tabular-nums; }
  .dim { color: #97a3b5; font-size: 11px; }

  @media (max-width: 980px) {
    .rig { grid-template-columns: 1fr; }
    .panel { flex-direction: row; flex-wrap: wrap; }
    .card { flex: 1 1 200px; }
  }
</style>
</head>
<body>
<div class="rig">
  <header class="bar">
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <h1>LUMEN<span>OS</span></h1>
        <p>LUX-32 自研指令集 · 自研内核 · 与 Linux 无关</p>
      </div>
    </div>
    <div class="actions">
      <span class="led" id="led"></span>
      <span id="pwr">RUNNING</span>
      <span id="uptime">0s</span>
      <button id="btnPause">暂停</button>
      <button id="btnReset">重启</button>
    </div>
  </header>

  <section class="crt">
    <div class="bezel">
      <div class="screen" id="screen"></div>
      <div class="glass"></div>
    </div>
    <div class="hint">直接打字即可 · snake 用方向键 · ESC 退出程序 · 输入 help 查看命令</div>
  </section>

  <aside class="panel">
    <div class="card"><h2>CPU · LUX-32</h2><div id="pCpu"></div></div>
    <div class="card"><h2>任务</h2><div id="pTask"></div></div>
    <div class="card"><h2>磁盘 LMFS</h2><div id="pFs"></div></div>
  </aside>
</div>

<script>/*
 * LUX-32 虚拟机 —— Lumen 系统的"硬件"
 * 自行设计的 32 位 RISC 指令集 + 内存 + 端口设备
 * 无任何第三方依赖，node 与浏览器共用
 *
 * 寄存器: r0..r9 通用, r10 = FP(帧指针), r11 = SP(栈指针)
 * 指令: 32 位定长小端; 立即数 12 位; 需要 32 位立即数的指令占两个字
 */
(function (root) {
  'use strict';

  var MEM_SIZE = 0x01000000;          // 16 MiB
  var VRAM = 0x000B8000;              // 80x25 文本显存 (码点:u32, 属性:u32)
  var VRAM_SIZE = 80 * 25 * 8;
  var WIDE = 0xFFFF;                  // 宽字符占位单元
  var IVT = 0x00000000;               // 256 项 * 8 字节
  var BOOT_ADDR = 0x00007C00;         // 引导扇区装入地址
  var FS_BASE_LBA = 512;              // 磁盘镜像中文件系统起始扇区

  var OP = {
    NOP: 0x00, LDI: 0x01, MOV: 0x02, LD: 0x03, ST: 0x04, LDB: 0x05, STB: 0x06,
    ADD: 0x07, SUB: 0x08, MUL: 0x09, DIV: 0x0A, MOD: 0x0B,
    AND: 0x0C, OR: 0x0D, XOR: 0x0E, SHL: 0x0F, SHR: 0x10, SAR: 0x11,
    NOT: 0x12, NEG: 0x13, CMP: 0x14,
    JMP: 0x15, JZ: 0x16, JNZ: 0x17, JL: 0x18, JLE: 0x19, JG: 0x1A, JGE: 0x1B,
    CALL: 0x1C, RET: 0x1D, PUSH: 0x1E, POP: 0x1F, JR: 0x20,
    SYS: 0x21, IN: 0x22, OUT: 0x23, IRET: 0x24, EI: 0x25, DI: 0x26, HLT: 0x27,
    ADDI: 0x2A, OUTR: 0x2B, INR: 0x2C
  };

  function Machine(opts) {
    opts = opts || {};
    this.mem = new Uint8Array(MEM_SIZE);
    this.dv = new DataView(this.mem.buffer);
    this.r = new Int32Array(12);
    this.pc = 0;
    this.zf = 0; this.sf = 0; this.cf = 0;
    this.IF = 0;
    this.halted = false;
    this.dead = false;              // 不可恢复错误
    this.cycles = 0;
    this.instrs = 0;
    this.ticks = 0;                 // 100Hz
    this.pending = 0;               // 最近一个挂起向量(显示用)
    this.pendingVecs = [];          // 挂起中断队列
    this.keyQueue = [];
    this.disk = new Uint8Array(0);
    this.sector = new Uint8Array(512);
    this.sectorPtr = 0;
    this.lba = 0;
    this.cursor = 0;
    this.rtcIdx = 0;
    this.crIdx = 0x0f;
    this.fault = '';
    this.timerEnabled = true;
    this.trace = null;              // 调试：指令日志开关
    this.log = [];
    this.lastScreen = null;
    this._screenCache = '';
  }

  Machine.prototype.reset = function () {
    this.r.fill(0);
    this.r[11] = 0x001F0000;
    this.pc = 0;
    this.IF = 0; this.zf = 0; this.sf = 0; this.cf = 0;
    this.halted = false; this.dead = false;
    this.cycles = 0; this.instrs = 0; this.ticks = 0;
    this.pending = 0; this.pendingVecs = []; this.keyQueue = [];
    this.cursor = 0;
  };

  // ---------- 内存 ----------
  Machine.prototype.rd32 = function (a) {
    a = a | 0;
    if (a < 0 || a + 4 > MEM_SIZE) { this.raiseFault('read out of memory @0x' + (a >>> 0).toString(16)); return 0; }
    return this.dv.getInt32(a, true);
  };
  Machine.prototype.wr32 = function (a, v) {
    a = a | 0;
    if (a < 0 || a + 4 > MEM_SIZE) { this.raiseFault('write out of memory @0x' + (a >>> 0).toString(16)); return; }
    this.dv.setInt32(a, v, true);
  };
  Machine.prototype.rd8 = function (a) {
    a = a | 0;
    if (a < 0 || a >= MEM_SIZE) { this.raiseFault('read byte out of memory'); return 0; }
    return this.mem[a];
  };
  Machine.prototype.wr8 = function (a, v) {
    a = a | 0;
    if (a < 0 || a >= MEM_SIZE) { this.raiseFault('write byte out of memory'); return; }
    this.mem[a] = v & 0xff;
  };
  Machine.prototype.push = function (v) {
    var sp = (this.r[11] - 4) | 0;
    this.r[11] = sp;
    this.wr32(sp, v);
  };
  Machine.prototype.pop = function () {
    var v = this.rd32(this.r[11]);
    this.r[11] = (this.r[11] + 4) | 0;
    return v;
  };

  Machine.prototype.raiseFault = function (msg) {
    if (!this.dead) { this.dead = true; this.fault = msg; }
  };

  // ---------- 端口设备 ----------
  Machine.prototype.inb = function (port) {
    switch (port) {
      case 0x40: return this.ticks | 0;                       // PIT 计数器
      case 0x60: return this.keyQueue.length ? this.keyQueue.shift() : 0;
      case 0x64: return this.keyQueue.length ? 1 : 0;
      case 0x71: return this.rtcRead();
      case 0x3D5: return (this.crIdx === 0x0F ? (this.cursor & 0xff) : (this.cursor >> 8) & 0xff);
      case 0x1F0: return this.disk.length / 512 | 0;          // 扇区总数
      case 0x1F4: {                                           // 扇区数据(逐字节)
        if (this.sectorPtr >= 512) return 0;
        return this.sector[this.sectorPtr++];
      }
      case 0x1F5: return this.sectorPtr;
      default: return 0;
    }
  };

  Machine.prototype.outb = function (port, val) {
    switch (port) {
      case 0x20: break;                                        // EOI
      case 0x70: this.rtcIdx = val & 0xff; break;
      case 0x3D4: this.crIdx = val & 0xff; break;
      case 0x3D5:
        if (this.crIdx === 0x0F) this.cursor = (this.cursor & 0x3F00) | (val & 0xff);
        else if (this.crIdx === 0x0E) this.cursor = (this.cursor & 0xff) | ((val & 0x3f) << 8);
        break;
      case 0x1F1: this.lba = val & 0xffff; break;
      case 0x1F2:                                              // 磁盘命令
        if (val === 1 || val === 2) {
          var off = this.lba * 512;
          if (off >= 0 && off + 512 <= this.disk.length) {
            if (val === 1) this.sector.set(this.disk.subarray(off, off + 512));
            else this.disk.set(this.sector, off);
          }
          this.sectorPtr = 0;
        } else if (val === 0) this.sectorPtr = 0;
        break;
      case 0x1F4:
        if (this.sectorPtr < 512) this.sector[this.sectorPtr++] = val & 0xff;
        break;
      default: break;
    }
  };

  Machine.prototype.rtcRead = function () {
    var d = new Date();
    switch (this.rtcIdx) {
      case 0: return d.getSeconds();
      case 2: return d.getMinutes();
      case 4: return d.getHours();
      case 6: return d.getDay();
      case 7: return d.getDate();
      case 8: return d.getMonth() + 1;
      case 9: return d.getFullYear() - 2000;
      default: return 0;
    }
  };

  // ---------- 中断 ----------
  Machine.prototype.raiseIRQ = function (vec) {
    if (this.dead) return;
    if (!this.IF) {
      if (this.pendingVecs.indexOf(vec) < 0) this.pendingVecs.push(vec);
      this.pending = vec;
      return;
    }
    this.halted = false;
    this.deliver(vec);
  };

  Machine.prototype.takePending = function () {
    if (!this.pendingVecs.length) return 0;
    var v = this.pendingVecs.shift();
    this.pending = this.pendingVecs.length ? this.pendingVecs[0] : 0;
    return v;
  };

  Machine.prototype.deliver = function (vec) {
    var ivtAddr = IVT + vec * 8;
    var handler = this.rd32(ivtAddr);
    if (!handler) { this.raiseFault('unhandled interrupt 0x' + vec.toString(16)); return; }
    this.pending = this.pendingVecs.length ? this.pendingVecs[0] : 0;
    this.push(this.pc);                 // 先压返回地址(在栈底)
    this.push((this.IF ? 1 : 0));       // 再压标志(在栈顶, iret 先弹出)
    this.IF = 0;
    this.pc = handler;
    this.halted = false;
  };

  // ---------- 执行 ----------
  Machine.prototype.step = function () {
    if (this.dead) return false;
    if (this.halted) {
      var pv = this.takePending();
      if (pv && this.IF) { this.halted = false; this.deliver(pv); }
      else { if (pv) this.pendingVecs.unshift(pv); return false; }
    }
    var pc = this.pc;
    if (pc < 0 || pc + 4 > MEM_SIZE) { this.raiseFault('pc out of range'); return false; }
    var ir = this.dv.getUint32(pc, true);
    var op = (ir >>> 24) & 0xff;
    var rd = (ir >>> 20) & 0xf;
    var ra = (ir >>> 16) & 0xf;
    var rb = (ir >>> 12) & 0xf;
    var imm = ((ir << 20) >> 20) | 0;         // 符号扩展 12 位
    var immu = ir & 0xfff;
    var r = this.r;
    var npc = pc + 4;
    var a, b, res, ea;

    switch (op) {
      case OP.NOP: break;
      case OP.LDI:
        r[rd] = this.rd32(pc + 4); npc = pc + 8; break;
      case OP.MOV: r[rd] = r[ra]; break;
      case OP.LD: ea = (r[ra] + imm) | 0; r[rd] = this.rd32(ea); break;
      case OP.ST: ea = (r[ra] + imm) | 0; this.wr32(ea, r[rb]); break;
      case OP.LDB: ea = (r[ra] + imm) | 0; r[rd] = this.rd8(ea) & 0xff; break;
      case OP.STB: ea = (r[ra] + imm) | 0; this.wr8(ea, r[rb]); break;
      case OP.ADD: res = (r[ra] + r[rb]) | 0; r[rd] = res; this.setZS(res); break;
      case OP.SUB: res = (r[ra] - r[rb]) | 0; r[rd] = res; this.setZS(res); break;
      case OP.MUL: res = Math.imul(r[ra], r[rb]); r[rd] = res; this.setZS(res); break;
      case OP.DIV:
        b = r[rb];
        if (b === 0) { res = 0; this.cf = 0; }
        else if (r[ra] === -2147483648 && b === -1) res = -2147483648;
        else res = (r[ra] / b) | 0;
        r[rd] = res; this.setZS(res); break;
      case OP.MOD:
        b = r[rb];
        res = b === 0 ? 0 : (r[ra] % b) | 0;
        r[rd] = res; this.setZS(res); break;
      case OP.AND: res = r[ra] & r[rb]; r[rd] = res; this.setZS(res); break;
      case OP.OR: res = r[ra] | r[rb]; r[rd] = res; this.setZS(res); break;
      case OP.XOR: res = r[ra] ^ r[rb]; r[rd] = res; this.setZS(res); break;
      case OP.SHL: res = (r[ra] << (r[rb] & 31)) | 0; r[rd] = res; this.setZS(res); break;
      case OP.SHR: res = (r[ra] >>> (r[rb] & 31)) | 0; r[rd] = res; this.setZS(res); break;
      case OP.SAR: res = (r[ra] >> (r[rb] & 31)) | 0; r[rd] = res; this.setZS(res); break;
      case OP.NOT: r[rd] = ~r[ra]; this.setZS(r[rd]); break;
      case OP.NEG: r[rd] = (-r[ra]) | 0; this.setZS(r[rd]); break;
      case OP.CMP:
        a = r[ra]; b = r[rb];
        this.cf = a < b ? -1 : (a > b ? 1 : 0);
        this.zf = a === b ? 1 : 0;
        this.sf = (a - b) < 0 ? 1 : 0;
        break;
      case OP.JMP: npc = this.rd32(pc + 4); break;
      case OP.JZ: if (this.zf) npc = this.rd32(pc + 4); else npc = pc + 8; break;
      case OP.JNZ: if (!this.zf) npc = this.rd32(pc + 4); else npc = pc + 8; break;
      case OP.JL: if (this.cf < 0) npc = this.rd32(pc + 4); else npc = pc + 8; break;
      case OP.JLE: if (this.cf <= 0) npc = this.rd32(pc + 4); else npc = pc + 8; break;
      case OP.JG: if (this.cf > 0) npc = this.rd32(pc + 4); else npc = pc + 8; break;
      case OP.JGE: if (this.cf >= 0) npc = this.rd32(pc + 4); else npc = pc + 8; break;
      case OP.CALL: this.push(pc + 8); npc = this.rd32(pc + 4); break;
      case OP.RET: npc = this.pop(); break;
      case OP.PUSH: this.push(r[ra]); break;
      case OP.POP: r[rd] = this.pop(); break;
      case OP.JR: npc = r[ra]; break;
      case OP.SYS: this.softInt(0x80); npc = this.pc; return true;
      case OP.IN: r[rd] = this.inb(immu); break;
      case OP.OUT: this.outb(immu, r[ra]); break;
      case OP.IRET:
        this.IF = this.pop() & 1;
        npc = this.pop();
        break;
      case OP.EI:
        this.IF = 1;
        if (this.pendingVecs.length) { this.deliver(this.takePending()); this.instrs++; this.cycles++; return true; }
        break;
      case OP.DI: this.IF = 0; break;
      case OP.HLT: this.halted = true; npc = pc + 4; break;
      case OP.ADDI: res = (r[ra] + imm) | 0; r[rd] = res; this.setZS(res); break;
      case OP.OUTR: this.outb(r[ra] | 0, r[rb] | 0); break;
      case OP.INR: r[rd] = this.inb(r[ra] | 0) | 0; break;
      default:
        this.raiseFault('bad opcode 0x' + op.toString(16) + ' @0x' + pc.toString(16));
        return false;
    }
    if (this.trace) this.log.push(pc.toString(16));
    this.pc = npc | 0;
    this.instrs++;
    this.cycles++;
    // 中断被挂起时, 一旦 IF 恢复就立刻投递
    if (this.IF && this.pendingVecs.length) this.deliver(this.takePending());
    return true;
  };

  Machine.prototype.setZS = function (v) {
    this.zf = v === 0 ? 1 : 0;
    this.sf = v < 0 ? 1 : 0;
  };

  Machine.prototype.softInt = function (vec) {
    var handler = this.rd32(IVT + vec * 8);
    if (!handler) { this.raiseFault('unhandled software interrupt 0x' + vec.toString(16)); return; }
    this.push(this.pc + 4);          // SYS 指令之后
    this.push(this.IF ? 1 : 0);
    this.IF = 0;
    this.pc = handler;
  };

  Machine.prototype.run = function (budget) {
    budget = budget || 200000;
    var n = 0;
    while (n < budget) {
      if (this.dead || this.halted) break;
      if (!this.step()) break;
      n++;
    }
    return n;
  };

  // ---------- 引导 ----------
  Machine.prototype.loadImage = function (bytes) {
    this.reset();
    this.disk = bytes;
    // 搬运引导扇区到 0x7C00
    this.mem.set(bytes.subarray(0, 512), BOOT_ADDR);
    this.pc = BOOT_ADDR;
    this.IF = 0;
  };

  Machine.prototype.attachDisk = function (bytes) { this.disk = bytes; };

  // ---------- 显存 ----------
  Machine.prototype.screenText = function () {
    var out = '';
    for (var y = 0; y < 25; y++) {
      var line = '';
      for (var x = 0; x < 80; x++) {
        var cp = this.dv.getUint32(VRAM + (y * 80 + x) * 8, true);

           (cp >= 0xFFE0 && cp <= 0xFFE6);
  }
  function chOf(cp) {
    if (cp === 0) return ' ';
    try { return String.fromCodePoint(cp); } catch (e) { return ' '; }
  }

  function render() {
    if (!vm) return;
    var cells = vm.screenCells();
    var cur = vm.cursor | 0;
    for (var y = 0; y < 25; y++) {
      var html = '', run = '', runAttr = -1;
      for (var x = 0; x < 80; x++) {
        var i = y * 80 + x;
        var cp = cells[i * 2];
        var at = cells[i * 2 + 1];
        if (cp === 0xFFFF) continue;              // 宽字符占位单元
        var w = cp > 0 && isWide(cp);
        if (i === cur && blinkOn) {
          if (run) { html += spanHTML(run, runAttr); run = ''; runAttr = -1; }
          html += '<span class="cur">' + (w ? '&#12288;' : ' ') + '</span>';
          continue;
        }
        if (w) {
          if (run) { html += spanHTML(run, runAttr); run = ''; runAttr = -1; }
          html += '<span class="w2" style="color:' + PAL[at & 0x0f] + '">' + esc(chOf(cp)) + '</span>';
          continue;
        }
        if (at !== runAttr) {
          if (run) html += spanHTML(run, runAttr);
          run = '';
          runAttr = at;
        }
        run += chOf(cp);
      }
      if (run) html += spanHTML(run, runAttr);
      if (html !== cache[y]) { rows[y].innerHTML = html; cache[y] = html; }
    }
  }

  /* ---------------- 键盘 ---------------- */
  var KMAP = {};
  (function () {
    var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    for (var i = 0; i < 26; i++) KMAP['Key' + letters[i]] = i + 1;
    for (var d = 0; d < 10; d++) KMAP['Digit' + d] = 27 + d;
    KMAP.Enter = 37; KMAP.Escape = 38; KMAP.Backspace = 39; KMAP.Tab = 40; KMAP.Space = 41;
    KMAP.Minus = 42; KMAP.Equal = 43; KMAP.Comma = 44; KMAP.Period = 45; KMAP.Slash = 46;
    KMAP.Semicolon = 47; KMAP.Quote = 48; KMAP.BracketLeft = 49; KMAP.BracketRight = 50;
    KMAP.Backslash = 51; KMAP.Backquote = 52;
    KMAP.ArrowUp = 53; KMAP.ArrowDown = 54; KMAP.ArrowLeft = 55; KMAP.ArrowRight = 56;
  })();

  function key(code) {
    if (!vm) return;
    if (vm.keyQueue.length > 24) vm.keyQueue.shift();
    vm.keyQueue.push(code);
    vm.raiseIRQ(0x21);
  }

  window.addEventListener('keydown', function (e) {
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') { key(57); return; }
    if (e.ctrlKey && e.code !== 'ControlLeft') return;
    var c = KMAP[e.code];
    if (c !== undefined) {
      e.preventDefault();
      key(c);
    }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') key(58);
  });

  /* ---------------- 监视面板 ---------------- */
  function hex(v) {
    v = v >>> 0;
    var s = v.toString(16).toUpperCase();
    while (s.length < 6) s = '0' + s;
    return '0x' + s;
  }
  function readStr(addr, max) {
    var s = '';
    for (var i = 0; i < max; i++) {
      var c = vm.mem[addr + i];
      if (!c) break;
      s += String.fromCharCode(c);
    }
    return s;
  }
  var STATE_NAME = { 1: '就绪', 2: '运行', 3: '等待', 4: '退出' };

  function updatePanel() {
    if (!vm) return;
    var r = vm.regs();
    document.getElementById('pCpu').innerHTML =
      kv('PC', hex(r.pc)) + kv('SP', hex(r.sp)) + kv('FP', hex(r.fp)) +
      kv('R0', (r.r0 | 0)) + kv('R1', (r.r1 | 0)) + kv('R2', (r.r2 | 0)) +
      kv('IF', vm.IF ? '开' : '关') + kv('指令数', vm.instrs.toLocaleString()) +
      kv('滴答', vm.ticks);

    var t = '';
    if (SYM.t_state !== undefined) {
      var curTask = vm.rd32(SYM.cur);
      for (var i = 0; i < 12; i++) {
        var st = vm.rd32(SYM.t_state + i * 4);
        if (!st) continue;
        var pid = vm.rd32(SYM.t_pid + i * 4);
        var nm = readStr(SYM.t_names + i * 16, 16) || '?';
        t += '<div class="taskrow' + (i === curTask ? ' on' : '') + '">' +
             '<b>' + pid + '</b><span>' + esc(nm) + '</span><i>' + (STATE_NAME[st] || st) + '</i></div>';
      }
    }
    document.getElementById('pTask').innerHTML = t || '<div class="dim">—</div>';

    var f = '';
    if (SYM.fsBase !== undefined && vm.disk && vm.disk.length) {
      var disk = vm.disk;
      var base = SYM.fsBase + 1024;          // 目录表在块 2
      var n = 0;
      var used = 0;
      for (var k = 0; k < 64; k++) {
        var e = base + k * 64;
        var name = '';
        for (var j = 0; j < 40; j++) {
          var c = disk[e + j];
          if (!c) break;
          name += String.fromCharCode(c);
        }
        if (!name) continue;
        var size = (disk[e + 44] | (disk[e + 45] << 8) | (disk[e + 46] << 16) | (disk[e + 47] << 24)) >>> 0;
        used += size;
        f += '<div class="filerow"><span>' + esc(name) + '</span><i>' + size + ' B</i></div>';
        n++;
      }
      f = '<div class="dim">' + n + ' 个文件 · ' + (used / 1024).toFixed(1) + ' KiB</div>' + f;
    }
    document.getElementById('pFs').innerHTML = f;

    var led = document.getElementById('led');
    led.className = 'led' + (paused ? ' off' : (vm.halted ? ' idle' : ' busy'));
    document.getElementById('pwr').textContent = paused ? 'PAUSED' : (vm.dead ? 'FAULT' : 'RUNNING');
  }

  function kv(k, v) {
    return '<div class="kvrow"><span>' + k + '</span><b>' + v + '</b></div>';
  }

  /* ---------------- 启动 / 主循环 ---------------- */
  function boot() {
    vm = new Machine();
    vm.loadImage(IMG);
    cache = [];
    for (var i = 0; i < rows.length; i++) { rows[i].innerHTML = ''; cache.push(''); }
    acc = 0;
    last = performance.now();
    paused = false;
    document.getElementById('btnPause').textContent = '暂停';
    render();
  }

  var acc = 0, last = 0;

  function frame() {
    var now = performance.now();
    if (vm && !paused) {
      acc += now - last;
      if (acc > 200) acc = 200;
      var n = 0;
      while (acc >= 10 && n < 6) {
        acc -= 10;
        vm.ticks++;
        vm.raiseIRQ(0x20);
        n++;
      }
      var t0 = performance.now();
      while (performance.now() - t0 < 7) {
        if (vm.run(20000) === 0) break;
      }
    }
    last = now;
    render();
    requestAnimationFrame(frame);
  }

  document.getElementById('btnPause').addEventListener('click', function () {
    paused = !paused;
    this.textContent = paused ? '继续' : '暂停';
    updatePanel();
  });
  document.getElementById('btnReset').addEventListener('click', function () {
    boot();
  });

  setInterval(function () { blinkOn = !blinkOn; }, 520);
  setInterval(updatePanel, 220);
  setInterval(function () {
    document.getElementById('uptime').textContent = (vm ? (vm.ticks / 100).toFixed(1) + 's' : '0s');
  }, 300);

  boot();
  requestAnimationFrame(frame);

  // 供自动化测试与调试使用
  window.__lumen = { machine: function () { return vm; }, render: render, frame: frame, boot: boot };
})();
</script>
</body>
</html>
